<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0/css/bootstrap.min.css">
  <style>
    .custom-navbar {
      background-color: rgb(5, 32, 5) !important;
    }
    .icon-container a {
      color: white;
      margin-left: 10px; /* Ajusta este valor según necesites más o menos espacio */
    }
    .search-form {
      display: flex;
      margin-right: 10px;
    }
    .navbar-collapse {
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar" aria-label="Eighth navbar example">
    <div class="container">
      <button class="navbar-toggler order-1" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand order-2 ms-2" href="#">
        <img src="adsasdasd.png" alt="" width="240" height="auto">
      </a>
      <div class="collapse navbar-collapse order-3" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Hombre</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Mujer</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          </li>
        </ul>
      </div>
      <form class="search-form order-4 ms-auto">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
      </form>
      <div class="icon-container d-flex align-items-center order-5">
        <a href="#" class="text-light me-3"><i class="fas fa-sign-in-alt"></i></a> <!-- Icono de inicio de sesión -->
        <a href="#" class="text-light"><i class="fas fa-user"></i></a> <!-- Icono de perfil -->
      </div>
    </div>
  </nav>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0/js/bootstrap.min.js"></script>
</body>
</html>
